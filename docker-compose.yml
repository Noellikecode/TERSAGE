# Local containers for FIRST DUE. No credentials anywhere in this file.
#
# There are no emulators here. Firestore and Pub/Sub are reached as real
# services through Application Default Credentials, because what the contract
# suite asserts is transaction and ordering semantics -- exactly what an
# emulator approximates rather than reproduces. See tests/contract/conftest.py.
#
# This compose file runs the app in fake mode: in-memory storage and an
# in-process bus, no Google auth of any kind. `make demo` does the same thing
# without Docker.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: '8080'
      USE_FAKE_AGENTS: 'true'
      APP_ENV: local
      LOG_JSON: 'true'
    ports: ['8000:8080']

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: '8080'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ['3000:8080']
    depends_on:
      backend: { condition: service_started }
