# Local dependencies for FIRST DUE. No credentials anywhere in this file.
#
# The emulators exist so the Firestore and Pub/Sub adapters can be developed
# against real client libraries in later phases. Fake mode does not need them:
# `make demo` runs with nothing but Python and Node.
services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:497.0.0-emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8081
      --project=firstdue-local
    ports: ['8081:8081']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8081 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:497.0.0-emulators
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=firstdue-local
    ports: ['8085:8085']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8085 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: '8080'
      USE_FAKE_AGENTS: 'true'
      APP_ENV: local
      LOG_JSON: 'true'
      FIRESTORE_EMULATOR_HOST: firestore:8081
      PUBSUB_EMULATOR_HOST: pubsub:8085
    ports: ['8000:8080']
    depends_on:
      firestore: { condition: service_started }
      pubsub: { condition: service_started }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: '8080'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ['3000:8080']
    depends_on:
      backend: { condition: service_started }
