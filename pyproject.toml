[project]
name = "firstdue"
version = "0.1.0"
description = "FIRST DUE -- municipal structural intelligence as an institutional agent fleet"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<0.31",
  "sse-starlette>=2.1,<3",
  # 0.28 is the floor the Gen AI SDK requires. The only httpx surface this
  # project uses is `timeout=`, `headers=`, and `base_url=`, none of which
  # changed -- 0.28 dropped the deprecated `app=` and `proxies=` shortcuts.
  "httpx>=0.28,<0.29",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# Live-mode Google clients. Fake mode -- the default, and the whole test suite --
# needs none of them, which is why they are an extra rather than a dependency.
google = [
  # The Google Gen AI SDK. This is the agent framework the fleet's model calls
  # go through -- Gemini for extract/compose/explain, Gemma for triage -- and it
  # talks to Vertex AI rather than the public Gemini API, so the same project,
  # location, and service-account identity govern every call.
  "google-genai>=2.0,<3",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-pubsub>=2.23,<3",
  "google-auth>=2.35,<3",
  # Pinned below 2.35.0, which is a regression and not a preference.
  #
  # 2.35.0 mangles the Firestore routing header: every RPC comes back
  # `INVALID_ARGUMENT: Invalid database id %28default%29` -- the parentheses of
  # the default database id, percent-encoded and then not decoded. It is not
  # Firestore's doing; the same firestore release works either side of it, and
  # pinning api-core alone fixes it.
  #
  # It cost a deployment to find, because nothing local reproduced it: the
  # laptop had resolved 2.34.0 months earlier and the image resolved the newest
  # release at build time, so the two differed only inside the container. The
  # whole fleet started, imported cleanly, and died in the lifespan hook.
  # Verified by bisecting inside the deployed image itself.
  "google-api-core>=2.34,<2.35",
  # Every package below is named by a ConfigurationError that tells the operator
  # to "install the 'google' extra". Following that instruction has to actually
  # fix the error, so the extra ships all of them.
  "google-api-python-client>=2.140,<3",   # Calendar, Gmail
  "google-cloud-storage>=2.18,<4",        # pre-incident plan store
  "google-cloud-aiplatform>=1.71,<2",     # Vertex: Gemini and Vector Search
  "google-cloud-secret-manager>=2.20,<3",
  "google-cloud-modelarmor>=0.2,<1",       # the ingested-document screen
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-gcp-trace>=1.7,<2",
  # The two slow-loop watchers that have to look things up run a reasoning
  # graph: decide what to read, notice what is ambiguous, ask again, stop.
  # LangGraph is the *executor* for that graph, not the graph -- the nodes and
  # the router are ordinary code in `agents/graphs/`, and a built-in driver
  # runs the identical set when the package is absent. So these belong here
  # beside the Google clients rather than in the base dependencies: fake mode,
  # `make demo`, and the whole test suite must run without them installed.
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  # Gemini for the planner's one job: choose which of a closed list of lookups
  # to do next. It reaches Vertex AI, under the same project and
  # service-account identity as every other model call in the fleet.
  "langchain-google-vertexai>=3.0,<4",
]

[project.scripts]
firstdue = "firstdue.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<2",
  # The Google clients are dev dependencies as well as an optional extra, so the
  # Firestore, Pub/Sub, and Gen AI adapters are type-checked against the real
  # client API rather than against an `ignore_missing_imports` hole. No
  # credentials are needed to install them, and fake mode still never imports
  # them. The Gen AI SDK is here for the same reason and one more: it is the
  # agent framework, so a change that breaks the model seam should break the
  # type check rather than the first live call.
  "google-genai>=2.0,<3",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-pubsub>=2.23,<3",
  # Same argument, for the same reason. The reasoning graphs compile against
  # LangGraph's `StateGraph` and the planner against `ChatVertexAI`, so both
  # seams are type-checked against the real API rather than against an
  # `ignore_missing_imports` hole -- and a release that moves either one breaks
  # the type check rather than the first live pass over a district.
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-google-vertexai>=3.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/firstdue"]

[tool.uv]
package = true

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "invariant: domain invariant that must never regress",
  "authorization: authorization / grant-scope behaviour",
  "concurrency: optimistic concurrency behaviour",
  "idempotency: idempotency-key behaviour",
  "degraded: degraded-service / failure-mode behaviour",
]
filterwarnings = ["error"]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "DTZ",       # timezone-aware datetimes (safety-critical here)
  "T20",       # no print in library code
  "SIM",       # simplify
  "PTH",       # pathlib
  "RUF",
  "S",         # bandit
  "ANN",       # annotations
]
ignore = [
  "ANN401",  # Any is required in a few protocol payload positions
  "A003",    # pydantic models legitimately carry fields named `type`, `id`
  "ANN101",  # deprecated: annotating `self` adds nothing
  "ANN102",  # deprecated: annotating `cls` adds nothing
  "UP040",   # PEP 695 aliases interact badly with pydantic discriminated unions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001", "ANN003", "ANN202"]  # asserts, loose test signatures
"backend/src/firstdue/cli.py" = ["T20"]             # the CLI is allowed to print
"scripts/**" = [
  "T20",     # operator scripts report to a terminal
  "SIM105",
  # These three are the shape of an operator script that talks to one Google
  # API: `gcloud` for a token, and urllib against a constant host. The URLs are
  # built from argparse defaults, not from anything a caller supplies.
  "S603",
  "S607",
  "S310",
]

[tool.ruff.lint.isort]
known-first-party = ["firstdue"]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.12"
mypy_path = "backend/src"
packages = ["firstdue"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# The Google clients are an optional extra. The adapters import them lazily and
# fail loudly when they are absent, so type-checking a fake-mode checkout must
# not require them to be installed.
[[tool.mypy.overrides]]
module = [
  "google.*",
  "google.cloud.*",
  "vertexai.*",
  "googleapiclient.*",
  "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend/src/firstdue"]
branch = true
