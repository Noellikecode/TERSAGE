name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen || uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Strict mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: OpenAPI contract has not drifted
        # The console's typed client is generated against docs/openapi.json. A
        # backend change that alters the contract without regenerating it
        # produces a console that type-checks against a document the server no
        # longer serves -- which fails at runtime, in the browser, and not here.
        run: |
          uv run firstdue schema --out docs/openapi.json
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::OpenAPI drift; run 'make schema' and commit docs/openapi.json"
            exit 1
          fi
      - name: Demo seed is deterministic
        run: |
          uv run firstdue seed
          uv run firstdue verify-seed

  durable-memory:
    name: Durable memory and event transport (real Firestore and Pub/Sub)
    runs-on: ubuntu-latest
    # The emulators used to run here and were replaced. Two reasons, and the
    # second is the one that matters: they were fragile to start on a hosted
    # runner, and they are a reimplementation of the semantics this suite
    # exists to check. What it asserts -- that a transaction serialises a
    # read-compare-write, that `create` on an existing document fails at the
    # database rather than at a Python guard, that a fence counter survives a
    # release, that ordered delivery stays ordered -- is exactly what an
    # emulator is most likely to approximate. Against a real project, a pass
    # means the thing it says it means.
    permissions:
      contents: read
      # Workload Identity Federation mints a short-lived token from this.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Is a test project configured for this repository?
        # A fork, or this repository before anybody set the secrets up, has no
        # credentials and must not fail for it. The skip is loud: a green tick
        # on a job that proved nothing is worse than a red one.
        id: guard
        env:
          PROJECT: ${{ secrets.GCP_TEST_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          SA_KEY: ${{ secrets.GCP_TEST_SA_KEY }}
        run: |
          if [ -z "$PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Durable memory not verified::GCP_TEST_PROJECT_ID is not set, so the Firestore and Pub/Sub half of the contract suite did not run. The in-memory half runs in the Backend job."
            exit 0
          fi
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SA" ]; then
            echo "method=wif" >> "$GITHUB_OUTPUT"
          elif [ -n "$SA_KEY" ]; then
            echo "method=key" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Incomplete credentials::GCP_TEST_PROJECT_ID is set but no authentication method is. Set GCP_WIF_PROVIDER and GCP_WIF_SERVICE_ACCOUNT (preferred), or GCP_TEST_SA_KEY."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Federated identity: no long-lived key exists to leak, and the token
      # this mints expires in minutes. Preferred whenever it is configured.
      - uses: google-github-actions/auth@v2
        if: steps.guard.outputs.method == 'wif'
        with:
          project_id: ${{ secrets.GCP_TEST_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/auth@v2
        if: steps.guard.outputs.method == 'key'
        with:
          project_id: ${{ secrets.GCP_TEST_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_TEST_SA_KEY }}

      - uses: astral-sh/setup-uv@v3
        if: steps.guard.outputs.configured == 'true'
        with:
          enable-cache: true
      - run: uv python install 3.12
        if: steps.guard.outputs.configured == 'true'
      - run: uv sync --frozen || uv sync
        if: steps.guard.outputs.configured == 'true'

      - name: Contract suite, both backends
        # The same tests run in-memory and against Firestore. A skip means the
        # real backend was never reached, which would let the run pass on half
        # the coverage -- so a skip fails the job.
        if: steps.guard.outputs.configured == 'true'
        env:
          FIRESTORE_TEST_PROJECT: ${{ secrets.GCP_TEST_PROJECT_ID }}
          FIRESTORE_TEST_DATABASE: ${{ secrets.GCP_TEST_FIRESTORE_DATABASE }}
          PUBSUB_TEST_PROJECT: ${{ secrets.GCP_TEST_PROJECT_ID }}
        run: |
          set -o pipefail
          uv run pytest tests/contract -v -rs | tee /tmp/contract.txt
          if grep -qiE "^SKIPPED|[0-9]+ skipped" /tmp/contract.txt; then
            echo "::error title=A backend was skipped::The Firestore or Pub/Sub backend was not reached, so the contract suite proved only half of what it claims."
            exit 1
          fi

  infrastructure:
    name: Infrastructure (format, validate, IAM conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen || uv sync
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Formatting
        run: tofu fmt -check -recursive infra/terraform
      - name: Validate staging
        # -backend=false: validation needs the provider schemas, not the state
        # bucket. No credentials are involved, so this runs on a fork's PR too.
        run: |
          tofu -chdir=infra/terraform/envs/staging init -backend=false -input=false
          tofu -chdir=infra/terraform/envs/staging validate
      - name: Validate prod
        run: |
          tofu -chdir=infra/terraform/envs/prod init -backend=false -input=false
          tofu -chdir=infra/terraform/envs/prod validate
      - name: Terraform matches the code it claims to follow
        # Firestore indexes against COLLECTION_NAMES, IAM against the agent
        # descriptors, topics against the Topic enum. All checkable with no
        # cloud project, which is the point.
        run: uv run pytest tests/infra -v

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen || uv sync
      - name: Python advisories
        # Reported, not enforced. A brand-new advisory against a transitive
        # dependency with no fix available should not block a fix for something
        # else -- but it must be visible in the run that introduced it.
        continue-on-error: true
        run: |
          uv run --with pip-audit pip-audit --strict --progress-spinner off \
            || echo "::warning::pip-audit reported advisories"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Console advisories
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev || echo "::warning::npm audit reported advisories"

  frontend:
    name: Console (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: firstdue-backend:ci
      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: firstdue-console:ci
      - name: Backend container serves on $PORT as non-root
        run: |
          docker run --rm -d --name api -e PORT=8080 -p 8080:8080 firstdue-backend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break || sleep 1
          done
          test "$(docker exec api id -u)" != "0"
          curl -fsS http://localhost:8080/readyz
          docker stop api

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned binary rather than the action, for two reasons: it is the
      # same scanner at the same version that `make secret-scan` runs locally,
      # so a developer can reproduce a CI finding exactly; and it has no
      # licensing check, which the action applies to organization-owned
      # repositories and would fail this job for a reason unrelated to secrets.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the full history
        # --redact so a finding names the file and the rule without reprinting
        # the credential into a public log, which would publish what it found.
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

  staging-smoke:
    name: Staging smoke test
    # Gated on the secret existing, so this repository and every fork stay
    # green without one. `secrets` is not available in an `if` at job level for
    # forks, so the guard is an explicit input check inside the job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - name: Is staging configured for this repository?
        id: guard
        env:
          KEY: ${{ secrets.GCP_SMOKE_SA_KEY }}
          URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -n "$KEY" ] && [ -n "$URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "staging secrets are not set; skipping"
          fi
      - uses: astral-sh/setup-uv@v3
        if: steps.guard.outputs.configured == 'true'
        with:
          enable-cache: true
      - run: uv python install 3.12
        if: steps.guard.outputs.configured == 'true'
      - run: uv sync --frozen || uv sync
        if: steps.guard.outputs.configured == 'true'
      - uses: google-github-actions/auth@v2
        if: steps.guard.outputs.configured == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SMOKE_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.guard.outputs.configured == 'true'
      - name: Six checks against the deployed environment
        if: steps.guard.outputs.configured == 'true'
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          STAGING_TOKEN="$(gcloud auth print-identity-token --audiences="$STAGING_BASE_URL")"
          export STAGING_TOKEN
          uv run pytest tests/staging -v
